<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tokenizer FLORES Metrics</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <h1>Tokenizer FLORES Metrics</h1>
      <p id="caption" class="caption"></p>
    </header>

    <nav class="tabs" role="tablist" aria-label="Views">
      <button
        type="button"
        class="tab active"
        role="tab"
        aria-selected="true"
        aria-controls="tab-production"
        data-tab="production"
      >
        Production tokenizers
      </button>
      <button
        type="button"
        class="tab"
        role="tab"
        aria-selected="false"
        aria-controls="tab-experiment"
        data-tab="experiment"
      >
        Grapheme A/B (experiment)
      </button>
    </nav>

    <section id="tab-production" class="tab-panel active" role="tabpanel">
      <section class="controls">
        <label for="metric-select">Score</label>
        <select id="metric-select"></select>
        <aside id="explanation" class="explanation" aria-live="polite"></aside>
      </section>

      <section class="panel heatmap-panel">
        <h2 id="heatmap-title">Heatmap (worse → redder)</h2>
        <div id="heatmap" class="heatmap"></div>
        <p class="legend-note">
          Color scales by severity within this metric. Redder = worse for the selected score.
        </p>
      </section>
    </section>

    <section id="tab-experiment" class="tab-panel" role="tabpanel" hidden>
      <div id="experiment-sections"></div>
    </section>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
